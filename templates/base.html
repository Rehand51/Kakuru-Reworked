<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}KAKURU{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">カクル / KAKURU</a>
        <details class="navigation">
            <summary>Silahkan pilih</summary>
            <nav aria-label="Navigasi kalkulator">
                {% for item in nav %}
                <a href="/{{ item.slug }}" {% if item.active %}aria-current="page"{% endif %}>{{ item.label }}</a>
                {% endfor %}
            </nav>
        </details>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
