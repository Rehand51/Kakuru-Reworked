[package]
name = "kakuru"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kakuru"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
webbrowser = "1.2"
urlencoding = "2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"
winit = "0.30"

[package.metadata.android]
package = "com.rehand51.kakuru"
label = "KAKURU"
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35
